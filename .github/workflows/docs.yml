# SEO-CRITICAL: DOCS_BASE_PATH and DOCS_SITE_URL set every canonical and sitemap URL. Read SEO.md and ~/pensievelabs/seo/MASTER.md before changing it, then run pnpm --filter @clawscale/docs seo:check.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build packages and docs
        run: pnpm build && pnpm build:docs
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Google Search checks (seo/MASTER.md), blocks the deploy on any error
        run: pnpm --filter @clawscale/docs seo:check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
