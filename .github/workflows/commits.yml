# Checks pull request titles, descriptions and commit messages against "Commits and pull requests"
# in AGENTS.md. Stewards squash merge, so the title and the commit messages become the commit on main.
name: Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Title and messages
    # Dependabot writes its own text. .github/dependabot.yml gives its titles the chore(deps) prefix.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check the title, description and commit messages
        # Pull request text reaches the script through the environment, never through the shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          RANGE: origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/lint-commits.mjs "$RANGE"
