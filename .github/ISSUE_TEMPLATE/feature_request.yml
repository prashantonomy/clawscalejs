name: Feature request
description: Suggest a component, pattern, token or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or look you have in mind. Larger changes need a proposal first, see GOVERNANCE.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
